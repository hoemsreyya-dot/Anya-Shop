<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Wages</title>
  <style>
    table {
      width: 60%;
      border-collapse: collapse;
      margin: 20px auto;
      font-famil  y: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #ff8800;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #ffe0c0;
    }
    td.wage {
      color: #ff6600;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <th>NAME</th>
      <th>POSITION</th>
      <th>WAGE</th>
    </tr>
    <tr>
      <td>Emma Johnson</td>
      <td>Sales Associate</td>
      <td class="wage">$15.50 per hour</td>
    </tr>
    <tr>
      <td>Liam Thompson</td>
      <td>Customer Service Representative</td>
      <td class="wage">$14.75 per hour</td>
    </tr>
    <tr>
      <td>Olivia Rodriguez</td>
      <td>Marketing Coordinator</td>
      <td class="wage">$18.25 per hour</td>
    </tr>
    <tr>
      <td>Noah Smith</td>
      <td>IT Support Specialist</td>
      <td class="wage">$20.00 per hour</td>
    </tr>
    <tr>
      <td>Ava Davis</td>
      <td>Administrative Assistant</td>
      <td class="wage">$16.80 per hour</td>
    </tr>
  </table>
</body>
</html>
