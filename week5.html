<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kitty pizza shop</title>
    <link rel="icon" href="image/kitty.png">
</head>

<body>
        <table border="1">
            <tr>
                <td colspan="2"><center>pizza shop 2.0</center> </td>
            </tr>
            <tr>
                <td>Name : </td>
                <td><input type="text" placeholder="enter your name"></td>
            </tr>
            <tr>
                <td>Pizza toppings</td>
                <td><input type="radio">
                    <label for="">supreme</label><br>
                    <input type="radio">
                    <label for="">Vegterian</label><br>
                    <input type="radio">
                    <label for="">Hawaiian</label><br>
                </td>
            </tr>
            <tr>
                <td>Pizza size : </td>
                <td>
                    <select name="" id="">
                        <option value="">small</option>
                        <option value="">medium</option>
                        <option value="">big</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Optional Extras : </td>
                <td><input type="checkbox">
                    <label for="">Extra chess</label>
                    <input type="checkbox">
                    <label for="">Green pepper</label>

                </td>
            </tr>
            <tr>
                <td colspan="2">Delivery intruction : <br>
                    <textarea name="" id="" cols="40" rows="10"></textarea>
                </td>



            </tr>
            <tr>
                <td colspan="2">
                    <center>
                        <!-- <input type="submit"value="send order"> -->
                         <button>send order</button>
                    </center>
                </td>
            </tr>

        </table>
    </center>
</body>

</html>
